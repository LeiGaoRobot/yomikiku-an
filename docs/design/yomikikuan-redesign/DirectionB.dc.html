<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #F5F5F7; background: #0B1623; }
    a { color: #FF6B75; } a:hover { color: #FF8A92; }
    .wire { border: 1.5px dashed rgba(245,245,247,.28); border-radius: 8px; }
    .lbl { font-size: 11px; color: rgba(245,245,247,.5); letter-spacing: 0.04em; }
  </style>
</helmet>
<div style="width: 720px; height: 450px; background: #0B1623; display: flex; flex-direction: column; box-sizing: border-box; padding: 20px 24px; gap: 14px; position: relative;">
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em;">方向 B · 墨夜 · 听力优先</div>
    <div class="lbl">低保真 · 单句聚焦 / 影子跟读</div>
  </div>
  <div style="flex: 1; display: flex; gap: 16px; min-height: 0;">
    <div class="wire" style="width: 56px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0;">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: rgba(245,245,247,.16);"></div>
      <div style="width: 28px; height: 28px; border-radius: 8px; background: rgba(245,245,247,.16);"></div>
      <div style="width: 28px; height: 28px; border-radius: 8px; background: rgba(245,245,247,.16);"></div>
      <div style="flex: 1;"></div>
      <div class="lbl" style="writing-mode: vertical-rl;">文档 / 工具</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 0 16px;">
      <div class="lbl" style="text-align: center;">2 / 5 · 上一句淡出</div>
      <div style="font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', serif; font-size: 34px; line-height: 1.6; text-align: center; letter-spacing: 0.02em;">分からない言葉があれば、<span style="color: #FF6B75;">その場で</span>辞書を引ける。</div>
      <div style="font-size: 14px; color: rgba(245,245,247,.5); text-align: center;">わからない ことば が あれば、そのばで じしょ を ひける。</div>
      <div style="display: flex; align-items: center; justify-content: center; gap: 3px; height: 36px;">
        <div style="width: 3px; height: 10px; background: rgba(245,245,247,.3); border-radius: 2px;"></div><div style="width: 3px; height: 22px; background: rgba(245,245,247,.3); border-radius: 2px;"></div><div style="width: 3px; height: 30px; background: #FF6B75; border-radius: 2px;"></div><div style="width: 3px; height: 18px; background: #FF6B75; border-radius: 2px;"></div><div style="width: 3px; height: 26px; background: #FF6B75; border-radius: 2px;"></div><div style="width: 3px; height: 12px; background: rgba(245,245,247,.3); border-radius: 2px;"></div><div style="width: 3px; height: 20px; background: rgba(245,245,247,.3); border-radius: 2px;"></div><div style="width: 3px; height: 8px; background: rgba(245,245,247,.3); border-radius: 2px;"></div>
      </div>
      <div style="display: flex; justify-content: center; gap: 12px;">
        <div class="wire" style="width: 44px; height: 44px; border-radius: 50%;"></div>
        <div style="width: 56px; height: 56px; border-radius: 50%; background: #FF6B75; margin-top: -6px;"></div>
        <div class="wire" style="width: 44px; height: 44px; border-radius: 50%;"></div>
      </div>
    </div>
    <div class="wire" style="width: 150px; display: flex; flex-direction: column; gap: 8px; padding: 12px;">
      <div class="lbl">句子列表（缩略）</div>
      <div style="height: 8px; border-radius: 4px; background: rgba(245,245,247,.16); width: 80%;"></div>
      <div style="height: 8px; border-radius: 4px; background: #FF6B75; width: 100%;"></div>
      <div style="height: 8px; border-radius: 4px; background: rgba(245,245,247,.16); width: 70%;"></div>
      <div style="height: 8px; border-radius: 4px; background: rgba(245,245,247,.16); width: 90%;"></div>
      <div style="height: 8px; border-radius: 4px; background: rgba(245,245,247,.16); width: 60%;"></div>
      <div style="flex: 1;"></div>
      <div class="lbl">录音对比 / 语速</div>
      <div style="height: 28px; border-radius: 14px; background: rgba(245,245,247,.12);"></div>
    </div>
  </div>
  <div class="lbl">动机：把「听」放到第一位，一次只看一句，适合跟读与通勤。代价：阅读长文、编辑和 AI 面板都要退到二级入口，与现有「文档 + 编辑器」心智差异最大。</div>
</div>
</x-dc>
</body>
</html>
