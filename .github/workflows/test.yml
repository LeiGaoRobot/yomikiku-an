name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Install Playwright (ad-hoc, not committed to package.json)
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps

      - name: Run test suite (51 *.test.html pages, 1642 cases)
        run: npm test 2>&1 | tee test-output.log

      - name: Run E2E smoke suite (13 Playwright scenarios)
        run: npm run e2e 2>&1 | tee e2e-output.log

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          retention-days: 14

      - name: Upload E2E output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e-output.log
          retention-days: 14
