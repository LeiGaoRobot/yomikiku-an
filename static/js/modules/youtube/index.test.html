<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>youtube/index.js — tests</title>
  <style>
    body { font: 14px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif; padding: 20px; max-width: 880px; margin: 0 auto; }
    h1 { font-size: 18px; }
    .row { padding: 6px 10px; border-radius: 6px; margin: 4px 0; }
    .row.pass { background: #e7f9ed; border-left: 3px solid #34c759; }
    .row.fail { background: #ffe7e4; border-left: 3px solid #ff3b30; }
    .row .name { font-weight: 600; }
    .row .detail { opacity: .7; font-size: 12px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>youtube/index.js tests</h1>
  <div id="summary"></div>
  <div id="results"></div>

  <script type="module">
    import { mountPanel, unmountPanel } from './index.js';
    const results = [];
    const check = (n, c, d) => results.push({ name: n, pass: !!c, detail: d || '' });

    mountPanel(document);
    check('overlay mounted', !!document.querySelector('.youtube-overlay'));
    check('URL input present', !!document.querySelector('#ytUrlInput'));
    check('parse button present', !!document.querySelector('#ytParseBtn'));
    check('three tabs present', document.querySelectorAll('.youtube-tab').length === 3);
    check('tab content slot present', !!document.querySelector('#ytTabContent'));

    unmountPanel();
    check('overlay removed', !document.querySelector('.youtube-overlay'));

    check('window.__yomikikuanOpenYoutube registered',
      typeof window.__yomikikuanOpenYoutube === 'function');

    window.__yomikikuanOpenYoutube();
    check('classic-script entry remounts', !!document.querySelector('.youtube-overlay'));
    unmountPanel();
    check('cleanup after classic remount', !document.querySelector('.youtube-overlay'));

    const pass = results.filter(r => r.pass).length;
    const fail = results.length - pass;
    document.getElementById('summary').innerHTML =
      `<h3 style="color:${fail===0?'#1d7d3f':'#ff3b30'};">
        ${fail === 0 ? '✓ ALL PASS' : '✗ ' + fail + ' FAILED'} — ${pass}/${results.length}
      </h3>`;
    const root = document.getElementById('results');
    results.forEach(r => {
      const row = document.createElement('div');
      row.className = 'row ' + (r.pass ? 'pass' : 'fail');
      row.innerHTML = `<span class="name">${r.pass ? '✓' : '✗'} ${r.name}</span>${r.detail ? ` <span class="detail">${r.detail}</span>` : ''}`;
      root.appendChild(row);
    });
  </script>
</body>
</html>
