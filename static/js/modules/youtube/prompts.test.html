<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>youtube/prompts.js — tests</title>
  <style>
    body { font: 14px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif; padding: 20px; max-width: 880px; margin: 0 auto; }
    h1 { font-size: 18px; }
    .row { padding: 6px 10px; border-radius: 6px; margin: 4px 0; }
    .row.pass { background: #e7f9ed; border-left: 3px solid #34c759; }
    .row.fail { background: #ffe7e4; border-left: 3px solid #ff3b30; }
    .row .name { font-weight: 600; }
    .row .detail { opacity: .7; font-size: 12px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>youtube/prompts.js tests</h1>
  <div id="summary"></div>
  <div id="results"></div>

  <script type="module">
    import { buildTranscriptPrompt, buildTimedTranscriptPrompt, buildJlptPrompt }
      from './prompts.js';

    const results = [];
    const check = (n, c, d) => results.push({ name: n, pass: !!c, detail: d || '' });

    const t = buildTranscriptPrompt();
    check('transcript: mentions Japanese transcript', /Japanese|日本語/i.test(t));
    check('transcript: requests plain text or no markdown',
      /plain text|no markdown|no fences/i.test(t));

    const tt = buildTimedTranscriptPrompt();
    check('timed: requests JSON array', /\[\s*\{/.test(tt) && /start[\s\S]*end[\s\S]*text/i.test(tt));
    check('timed: forbids markdown fences', /no markdown|no fences|strict json/i.test(tt));

    const j = buildJlptPrompt({ level: 'N3', count: 3, mode: 'kadai' });
    check('jlpt: includes level', /N3/.test(j));
    check('jlpt: includes count', /\b3\b/.test(j));
    check('jlpt: instructs to listen to YouTube audio',
      /listen|video|audio|聴いて/i.test(j));
    check('jlpt: contains 課題理解', /課題理解/.test(j));

    let err;
    try { buildJlptPrompt({ level: 'N3', count: 3, mode: 'BOGUS' }); }
    catch (e) { err = e; }
    check('jlpt: unknown mode throws', err && /unknown mode/i.test(err.message));

    const pass = results.filter(r => r.pass).length;
    const fail = results.length - pass;
    document.getElementById('summary').innerHTML =
      `<h3 style="color:${fail===0?'#1d7d3f':'#ff3b30'};">
        ${fail === 0 ? '✓ ALL PASS' : '✗ ' + fail + ' FAILED'} — ${pass}/${results.length}
      </h3>`;
    const root = document.getElementById('results');
    results.forEach(r => {
      const row = document.createElement('div');
      row.className = 'row ' + (r.pass ? 'pass' : 'fail');
      row.innerHTML = `<span class="name">${r.pass ? '✓' : '✗'} ${r.name}</span>${r.detail ? ` <span class="detail">${r.detail}</span>` : ''}`;
      root.appendChild(row);
    });
  </script>
</body>
</html>
