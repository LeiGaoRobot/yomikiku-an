<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>youtube/tabs/companion-sync.js — tests</title>
  <style>
    body { font: 14px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif; padding: 20px; max-width: 880px; margin: 0 auto; }
    h1 { font-size: 18px; }
    .row { padding: 6px 10px; border-radius: 6px; margin: 4px 0; }
    .row.pass { background: #e7f9ed; border-left: 3px solid #34c759; }
    .row.fail { background: #ffe7e4; border-left: 3px solid #ff3b30; }
    .row .name { font-weight: 600; }
    .row .detail { opacity: .7; font-size: 12px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>youtube/tabs/companion-sync.js tests</h1>
  <div id="summary"></div>
  <div id="results"></div>

  <script type="module">
    import { findActiveIndex } from './companion-sync.js';
    const results = [];
    const check = (n, c, d) => results.push({ name: n, pass: !!c, detail: d || '' });

    const segs = [
      { start: 0,   end: 3.2,  text: 'a' },
      { start: 3.2, end: 6.8,  text: 'b' },
      { start: 6.8, end: 10.0, text: 'c' },
    ];
    check('before first',                       findActiveIndex(segs, -1)  === -1);
    check('inside first',                       findActiveIndex(segs,  1.5) === 0);
    check('boundary start exclusive of next',   findActiveIndex(segs,  3.2) === 1);
    check('inside last',                        findActiveIndex(segs,  9.0) === 2);
    check('past end',                           findActiveIndex(segs, 99)   === -1);
    check('empty array',                        findActiveIndex([], 5)      === -1);
    check('non-array',                          findActiveIndex(null, 5)    === -1);
    check('NaN time',                           findActiveIndex(segs, NaN)  === -1);
    check('non-number time',                    findActiveIndex(segs, '5')  === -1);

    const pass = results.filter(r => r.pass).length;
    const fail = results.length - pass;
    document.getElementById('summary').innerHTML =
      `<h3 style="color:${fail===0?'#1d7d3f':'#ff3b30'};">
        ${fail === 0 ? '✓ ALL PASS' : '✗ ' + fail + ' FAILED'} — ${pass}/${results.length}
      </h3>`;
    const root = document.getElementById('results');
    results.forEach(r => {
      const row = document.createElement('div');
      row.className = 'row ' + (r.pass ? 'pass' : 'fail');
      row.innerHTML = `<span class="name">${r.pass ? '✓' : '✗'} ${r.name}</span>${r.detail ? ` <span class="detail">${r.detail}</span>` : ''}`;
      root.appendChild(row);
    });
  </script>
</body>
</html>
