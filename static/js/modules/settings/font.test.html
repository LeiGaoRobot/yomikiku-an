<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>settings/font.js — tests</title>
  <style>
    body { font: 14px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif; padding: 20px; max-width: 880px; margin: 0 auto; }
    h1 { font-size: 18px; }
    .row { padding: 6px 10px; border-radius: 6px; margin: 4px 0; }
    .row.pass { background: #e7f9ed; border-left: 3px solid #34c759; }
    .row.fail { background: #ffe7e4; border-left: 3px solid #ff3b30; }
    .row .name { font-weight: 600; }
    .row .detail { opacity: .7; font-size: 12px; }
  </style>
</head>
<body>
  <h1>settings/font.js tests</h1>
  <div id="summary"></div>
  <div id="results"></div>

  <!-- DOM fixtures the module queries by id. A plain <input> (not
       type=range) is used on purpose: range inputs sanitize values above
       max / onto the step grid, which would hide the module's own clamp. -->
  <div id="font-fixtures" style="display:none">
    <input id="fontSizeRange" value="1">
    <span id="fontSizeValue"></span>
    <select id="editorInputFontSelect">
      <option value="">default</option>
      <option value="serif">serif</option>
      <option value="sans-serif">sans-serif</option>
    </select>
    <select id="editorContentFontSelect">
      <option value="">default</option>
      <option value="mono">mono</option>
      <option value="serif">serif</option>
    </select>
  </div>

  <script type="module">
    // settings/font.js self-bootstraps on import and reads localStorage.
    // Seed storage + DOM before the dynamic import.
    localStorage.clear();
    localStorage.setItem('app:fontScale', '1.25');
    localStorage.setItem('app:inputFont', 'serif');
    localStorage.setItem('app:contentFont', 'mono');

    const results = [];
    const check = (name, cond, detail) =>
      results.push({ name, pass: !!cond, detail: detail || '' });

    const mod = await import('./font.js');
    const root = document.documentElement;
    const cssVar = (name) => root.style.getPropertyValue(name).trim();
    const range = document.getElementById('fontSizeRange');
    const label = document.getElementById('fontSizeValue');
    const inputSel = document.getElementById('editorInputFontSelect');
    const contentSel = document.getElementById('editorContentFontSelect');

    // ---- bootstrap from storage ----
    check('bootstrap applies saved --font-scale', cssVar('--font-scale') === '1.25');
    check('bootstrap persists normalized scale', localStorage.getItem('app:fontScale') === '1.25');
    check('bootstrap syncs the range input value', range.value === '1.25');
    check('bootstrap renders the rounded percent label', label.textContent === '125%');
    check('bootstrap applies --input-font-family', cssVar('--input-font-family') === 'serif');
    check('bootstrap applies --content-font-family', cssVar('--content-font-family') === 'mono');
    check('bootstrap syncs the input font select', inputSel.value === 'serif');
    check('bootstrap syncs the content font select', contentSel.value === 'mono');

    // ---- exported helpers + classic-script globals ----
    check('exports initFontSizeControls', typeof mod.initFontSizeControls === 'function');
    check('exports applyFontScaleFromStorage', typeof mod.applyFontScaleFromStorage === 'function');
    check('exports applyFontFamilyFromStorage', typeof mod.applyFontFamilyFromStorage === 'function');
    check('exports initFontFamilyControls', typeof mod.initFontFamilyControls === 'function');
    check('sets window.__ESM_FONT_SETTINGS', window.__ESM_FONT_SETTINGS === true);
    check('sets window.__ESM_FONT_SETTINGS_INITED idempotency flag',
      window.__ESM_FONT_SETTINGS_INITED === true);
    check('exposes window.initFontSizeControls',
      typeof window.initFontSizeControls === 'function');
    check('exposes window.applyFontFamilyFromStorage',
      typeof window.applyFontFamilyFromStorage === 'function');

    // ---- range input → clamp(0.8, 1.5) branches ----
    range.value = '2';
    range.dispatchEvent(new Event('input'));
    check('input above 1.5 clamps --font-scale to 1.5', cssVar('--font-scale') === '1.5');
    check('clamped-high label reads 150%', label.textContent === '150%');
    check('clamped-high scale persisted', localStorage.getItem('app:fontScale') === '1.5');

    range.value = '0.5';
    range.dispatchEvent(new Event('input'));
    check('input below 0.8 clamps --font-scale to 0.8', cssVar('--font-scale') === '0.8');
    check('clamped-low label reads 80%', label.textContent === '80%');
    check('clamped-low scale persisted', localStorage.getItem('app:fontScale') === '0.8');

    range.value = '1.1';
    range.dispatchEvent(new Event('input'));
    check('in-range input applies verbatim', cssVar('--font-scale') === '1.1');
    check('in-range label reads 110%', label.textContent === '110%');

    range.value = 'not-a-number';
    range.dispatchEvent(new Event('input'));
    check('non-numeric input falls back to scale 1', cssVar('--font-scale') === '1');
    check('fallback label reads 100%', label.textContent === '100%');

    // ---- applyFontScaleFromStorage branches ----
    localStorage.setItem('app:fontScale', '1.4');
    mod.applyFontScaleFromStorage();
    check('applyFontScaleFromStorage reads 1.4', cssVar('--font-scale') === '1.4');

    localStorage.setItem('app:fontScale', '9');
    mod.applyFontScaleFromStorage();
    check('applyFontScaleFromStorage clamps 9 → 1.5', cssVar('--font-scale') === '1.5');

    localStorage.setItem('app:fontScale', 'nope');
    mod.applyFontScaleFromStorage();
    check('applyFontScaleFromStorage parses garbage → 1', cssVar('--font-scale') === '1');

    localStorage.removeItem('app:fontScale');
    mod.applyFontScaleFromStorage();
    check('applyFontScaleFromStorage no-op when storage key absent', cssVar('--font-scale') === '1');

    // ---- applyFontFamilyFromStorage branches ----
    localStorage.setItem('app:inputFont', 'sans-serif');
    localStorage.setItem('app:contentFont', 'serif');
    mod.applyFontFamilyFromStorage();
    check('applyFontFamilyFromStorage sets --input-font-family', cssVar('--input-font-family') === 'sans-serif');
    check('applyFontFamilyFromStorage sets --content-font-family', cssVar('--content-font-family') === 'serif');
    check('applyFontFamilyFromStorage syncs selects',
      inputSel.value === 'sans-serif' && contentSel.value === 'serif');

    localStorage.removeItem('app:inputFont');
    localStorage.removeItem('app:contentFont');
    mod.applyFontFamilyFromStorage();
    check('applyFontFamilyFromStorage no-op when storage keys absent',
      cssVar('--input-font-family') === 'sans-serif'
      && cssVar('--content-font-family') === 'serif');

    // ---- font-family select change wiring (guards empty values) ----
    inputSel.value = 'serif';
    inputSel.dispatchEvent(new Event('change'));
    check('input-font change applies + persists',
      cssVar('--input-font-family') === 'serif'
      && localStorage.getItem('app:inputFont') === 'serif');

    contentSel.value = 'mono';
    contentSel.dispatchEvent(new Event('change'));
    check('content-font change applies + persists',
      cssVar('--content-font-family') === 'mono'
      && localStorage.getItem('app:contentFont') === 'mono');

    inputSel.value = '';
    inputSel.dispatchEvent(new Event('change'));
    check('empty input-font selection is ignored',
      cssVar('--input-font-family') === 'serif'
      && localStorage.getItem('app:inputFont') === 'serif');

    // ---- re-running initFontSizeControls without range/value elements ----
    document.getElementById('font-fixtures').remove();
    localStorage.setItem('app:fontScale', '1.3');
    let initThrew = null;
    try { mod.initFontSizeControls(); } catch (e) { initThrew = e.message; }
    check('initFontSizeControls tolerates missing DOM', initThrew === null);
    check('initFontSizeControls still applies stored scale without range elements',
      cssVar('--font-scale') === '1.3');

    // ---- summary ----
    const pass = results.filter((r) => r.pass).length;
    const fail = results.length - pass;
    const summary = document.getElementById('summary');
    summary.innerHTML = `<h3 style="color:${fail === 0 ? '#1d7d3f' : '#ff3b30'};">
      ${fail === 0 ? '✓ ALL PASS' : '✗ ' + fail + ' FAILED'} — ${pass}/${results.length}
    </h3>`;
    const rootEl = document.getElementById('results');
    results.forEach((r) => {
      const row = document.createElement('div');
      row.className = 'row ' + (r.pass ? 'pass' : 'fail');
      row.innerHTML = `<span class="name">${r.pass ? '✓' : '✗'} ${r.name}</span>${r.detail ? ` <span class="detail">${r.detail}</span>` : ''}`;
      rootEl.appendChild(row);
    });
  </script>
</body>
</html>
