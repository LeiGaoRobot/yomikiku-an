<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>analyzer/ui/articleSummary.js — tests</title>
  <style>
    body { font: 14px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif; padding: 20px; max-width: 880px; margin: 0 auto; }
    h1 { font-size: 18px; }
    .row { padding: 6px 10px; border-radius: 6px; margin: 4px 0; }
    .row.pass { background: #e7f9ed; border-left: 3px solid #34c759; }
    .row.fail { background: #ffe7e4; border-left: 3px solid #ff3b30; }
    .row .name { font-weight: 600; }
    .row .detail { opacity: .7; font-size: 12px; }
    #scratch { display: none; }
  </style>
</head>
<body>
  <h1>analyzer/ui/articleSummary.js tests</h1>
  <div id="summary"></div>
  <div id="results"></div>
  <div id="scratch"></div>

  <script type="module">
    import { render } from './articleSummary.js';

    const results = [];
    const check = (name, cond, detail) =>
      results.push({ name, pass: !!cond, detail: detail || '' });

    const scratch = document.getElementById('scratch');

    // ---------- render: vocabulary "+" button save-to-vocab payload shape ----------
    {
      const bodyEl = document.createElement('div');
      scratch.appendChild(bodyEl);
      render(bodyEl, {
        vocabulary: [{ surface: '庵', reading: 'いおり', meaning_zh: '茅屋', example_ja: '読み聞く庵' }],
        recommendedLevel: 'N3',
      });

      let captured = null;
      const prevAdd = window.__yomikikuanAddVocab;
      window.__yomikikuanAddVocab = (entry) => { captured = entry; return Promise.resolve('fake-id'); };

      bodyEl.querySelector('.addv').click();
      window.__yomikikuanAddVocab = prevAdd;

      check('render vocab "+" sends entry.word (not entry.surface)',
        captured && captured.word === '庵',
        `got word=${JSON.stringify(captured && captured.word)}`);
      check('render vocab "+" sends entry.gloss (not entry.meaning_zh)',
        captured && captured.gloss === '茅屋',
        `got gloss=${JSON.stringify(captured && captured.gloss)}`);
      check('render vocab "+" sends entry.reading',
        captured && captured.reading === 'いおり');
    }

    {
      // Same un-awaited-rejection concern as jlpt/renderers.js's depthPanel.
      const bodyEl = document.createElement('div');
      scratch.appendChild(bodyEl);
      render(bodyEl, { vocabulary: [{ surface: 'X', reading: 'X', meaning_zh: 'X' }] });

      const prevAdd = window.__yomikikuanAddVocab;
      let rejectionSeenByWindow = false;
      const prevOnRejection = window.onunhandledrejection;
      window.onunhandledrejection = (ev) => { rejectionSeenByWindow = true; ev.preventDefault(); };
      window.__yomikikuanAddVocab = () => Promise.reject(new Error('EMPTY_VOCAB'));

      bodyEl.querySelector('.addv').click();
      await new Promise((r) => setTimeout(r, 20));

      window.__yomikikuanAddVocab = prevAdd;
      window.onunhandledrejection = prevOnRejection;

      check('render vocab "+" awaits addVocab (no unhandled rejection)',
        !rejectionSeenByWindow);
    }

    {
      // Regression guard for the other sections render() owns.
      const bodyEl = document.createElement('div');
      scratch.appendChild(bodyEl);
      render(bodyEl, {
        summary: 'テスト要約',
        recommendedLevel: 'N2',
        keySentences: ['一文目。'],
        learningPoints: ['ポイント1'],
      });
      check('render: summary section present', bodyEl.textContent.includes('テスト要約'));
      check('render: level pill present', !!bodyEl.querySelector('.summary-level-pill'));
      check('render: key sentence li present', bodyEl.querySelectorAll('li').length >= 2);
    }

    {
      const bodyEl = document.createElement('div');
      scratch.appendChild(bodyEl);
      render(bodyEl, null);
      check('render: null payload shows empty message, no throw', bodyEl.textContent.length > 0);
    }

    const pass = results.filter(r => r.pass).length;
    const fail = results.length - pass;
    const summary = document.getElementById('summary');
    summary.innerHTML = `<h3 style="color:${fail===0?'#1d7d3f':'#ff3b30'};">
      ${fail === 0 ? '✓ ALL PASS' : '✗ ' + fail + ' FAILED'} — ${pass}/${results.length}
    </h3>`;

    const root = document.getElementById('results');
    results.forEach(r => {
      const row = document.createElement('div');
      row.className = 'row ' + (r.pass ? 'pass' : 'fail');
      row.innerHTML = `<span class="name">${r.pass ? '✓' : '✗'} ${r.name}</span>${r.detail ? ` <span class="detail">${r.detail}</span>` : ''}`;
      root.appendChild(row);
    });
  </script>
</body>
</html>
